name: ZoteroLauncher
options:
  bundleIdPrefix: io.github.mbradaschia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.3.2
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  ZoteroLauncher:
    type: application
    platform: macOS
    sources:
      - path: ZoteroLauncher
      # The app's own copy of the view logic (js/lib, see VENDORED.md), bundled as Resources/lib.
      - path: js/lib
        type: folder
        buildPhase: resources
      # marked (MIT, VENDORED.md): a chat's answers, Markdown to HTML, bundled as Resources/vendor.
      - path: js/vendor
        type: folder
        buildPhase: resources
      # The sync contract both launchers read in place (contracts/Paths.js), bundled as Resources/Paths.js.
      - path: ../contracts/Paths.js
        buildPhase: resources
      # The merge of the sync folder's conflict copies, shared the same way (contracts/Merge.js).
      - path: ../contracts/Merge.js
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    # The AI features' installer (decision 7): the runner without its packages, its three scripts,
    # contracts/Paths.js and the bridge's manifest, laid out as install-runner.sh expects them.
    postCompileScripts:
      - name: RunnerKit
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          KIT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/RunnerKit"
          mkdir -p "$KIT/macos/scripts" "$KIT/contracts"
          # only the runner's own files: no packages, nothing hidden (.env), no logs
          rsync -a --delete --exclude node_modules --exclude '.*' --exclude '*.log' --exclude '*.env' "${PROJECT_DIR}/runner/" "$KIT/macos/runner/"
          cp "${PROJECT_DIR}/scripts/install-runner.sh" "${PROJECT_DIR}/scripts/safe-dest.sh" "${PROJECT_DIR}/scripts/copy-shared-paths.sh" "$KIT/macos/scripts/"
          cp "${PROJECT_DIR}/../contracts/Paths.js" "$KIT/contracts/Paths.js"
          cp "${PROJECT_DIR}/../zotero-bridge/manifest.in.json" "$KIT/bridge-manifest.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mbradaschia.zotero-launcher
        PRODUCT_NAME: ZoteroLauncher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zotero Launcher
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "The AI features read your papers' PDFs where Zotero keeps them, to extract their text."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "The AI features read your papers' PDFs where Zotero keeps them, to extract their text."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "The AI features read your papers' PDFs where Zotero keeps them, to extract their text."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "The AI features read your papers' PDFs where Zotero keeps them, to extract their text."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "The AI features read your papers' PDFs where Zotero keeps them, to extract their text."
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: MIT License
        # Not sandboxed: it reads Zotero's handshake in the user's temporary directory, talks to
        # Zotero on localhost and runs the prompt runner, none of which a sandbox allows.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the RunnerKit phase copies from the checkout
    scheme:
      testTargets:
        - ZoteroLauncherTests
  ZoteroLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZoteroLauncherTests
        excludes:
          - Fixtures
      # Captured bridge answers (scrubbed) and their goldens, as Fixtures/ in the test bundle.
      - path: ZoteroLauncherTests/Fixtures
        type: folder
        buildPhase: resources
      # The path table both launchers must reproduce.
      - path: ../contracts/fixtures/paths.json
        buildPhase: resources
    dependencies:
      - target: ZoteroLauncher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mbradaschia.zotero-launcher.tests
  # The real app driven on screen (real key events, the accessibility tree): its own scheme, not CI's.
  ZoteroLauncherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ZoteroLauncherUITests
    dependencies:
      - target: ZoteroLauncher
    settings:
      base:
        TEST_TARGET_NAME: ZoteroLauncher
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mbradaschia.zotero-launcher.uitests
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - ZoteroLauncherUITests

